---
layout: default
---
<div class="row g-5 mb-2">
  <div class="col-md-6">
    {{ content }}
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/assets/img/Shloka.jpg" alt="Home" width="100%">
  </div>
</div>

<div class="border-top mt-4"></div>

<div class="row g-5 mt-1 mb-4">
  <div class="col-md-6">
    <h5 class="fw-bold">Projects</h5>
    {% for item in site.data.settings.projects %}
      <div class="mt-3">
        <a class="entry-title" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
        <p class="mb-0">{{ item.description }}</p>
      </div>
    {% endfor %}
  </div>

  <div class="col-md-6">
    <h5 class="fw-bold">Written Work</h5>
    {% for post in site.posts limit: 1 %}
      <div class="mt-3">
        <a class="entry-title" href="{{ site.github.url }}{{ post.url }}">{{ post.title }}</a>
        <p class="mb-0">{{ post.date | date: "%b %-d, %Y" }}</p>
      </div>
    {% endfor %}
  </div>
</div>
