---
layout: default
---
<div class="row g-5 mb-2">
  <div class="col-md-6">
    {{ content }}
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/assets/img/Shloka.jpg" alt="Home" width="100%">
  </div>
</div>

<div class="border-top mt-4"></div>

<div class="row g-5 mt-1 mb-4">
  <div class="col-md-6">
    <h5 class="fw-bold section-title">Projects</h5>
    {% for item in site.data.settings.projects %}
      <div class="mt-3">
        <a class="entry-title" href="{% unless item.url contains '://' %}{{ site.github.url }}{% endunless %}{{ item.url }}">{{ item.name }}</a>
        {% if item.description %}<p class="mb-0 entry-desc">{{ item.description }}</p>{% endif %}
      </div>
    {% endfor %}
  </div>
</div>
