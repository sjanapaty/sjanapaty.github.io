<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  {% include head.html %}
  <body class="bare-page">
    <style>
      /* A full-bleed page for a single visual: no site header, no footer, no
         reading column. The theme's own body rules are overridden here rather
         than changed globally, so every other page is untouched. */
      html, body.bare-page {
        background: #000;
        color: #f0ede6;
        margin: 0;
        min-height: 100%;
      }
      body.bare-page .bare-wrap {
        max-width: 1340px;
        margin: 0 auto;
        padding: 1.25rem 1rem 2rem;
      }
      body.bare-page .bare-back {
        display: inline-block;
        margin-bottom: .75rem;
        font-size: .8rem;
        color: #9a958c !important;
        text-decoration: none;
      }
      body.bare-page .bare-back:hover { color: #fe9929 !important; }
    </style>
    <div class="bare-wrap">
      <a class="bare-back" href="{{ site.github.url }}/projects/">&larr; Projects</a>
      {{ content }}
    </div>
  </body>
</html>
